name: Unpack project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Publish project files
        run: |
          set -euo pipefail
          archive="solar-sales-funnel-analytics-clean.zip"
          test -f "$archive"

          extract_dir="$(mktemp -d)"
          unzip -q "$archive" -d "$extract_dir"
          rsync -a --exclude=".git/" --exclude="__pycache__/" "$extract_dir"/ ./

          git rm -- "$archive"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish complete analytics project"
          git push
